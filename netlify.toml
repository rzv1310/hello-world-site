# This file only applies to git-connected Netlify deploys.
#
# The site is deployed by uploading the prebuilt `dist/` folder to Netlify Drop:
#   1. bun run build   (or npm run build)
#   2. drag the `dist` folder to https://app.netlify.com/drop
#
# For Drop deploys this file is NOT used — headers come from `dist/_headers`,
# which `scripts/prerender.mjs` generates at build time. Do not copy a
# netlify.toml into `dist/`: a [build] section there makes Netlify Drop try to
# run a build inside the source-less folder, which fails.

[build]
  command = "npm run build"
  publish = "dist"

# Headers for git-connected builds are kept in sync with dist/_headers.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; media-src 'self'; frame-src https://www.google.com https://maps.google.com; connect-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every route is prerendered to its own HTML file (see scripts/prerender.mjs),
# so no SPA fallback is needed — Netlify serves <route>/index.html directly and
# falls back to the prerendered 404.html (with a 404 status) for unknown paths.
