<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" as="image" href="/hero-mobil-audit-statutar.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-audit-statutar.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/logo-helenico-advisory.webp" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Per-page title, description, canonical, Open Graph, structured data, etc.
         are rendered by react-helmet-async and injected here at build time. -->
    <!--app-head-->
</head>
  <body>
    <!-- Hidden form for Netlify build-time detection (JS-rendered forms require this) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden aria-hidden="true">
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="intent" />
      <input name="message" />
      <input name="gdpr-consent" />
    </form>

    <noscript><p style="text-align:center;padding:2rem">Acest site necesită JavaScript pentru a funcționa.</p></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
